apiVersion: apps/v1
kind: Deployment
metadata:
  name: computer-shop
  labels:
    app: computer-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: computer-shop
  template:
    metadata:
      labels:
        app: computer-shop
    spec:
      imagePullSecrets:
      - name: ecr-registry-secret
      containers:
      - name: computer-shop
        image: __IMAGE__
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet: {path: /health, port: 5000}
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /health, port: 5000}
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests: {cpu: 100m, memory: 96Mi}
          limits: {cpu: 500m, memory: 256Mi}
